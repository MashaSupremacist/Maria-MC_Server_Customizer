apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.msc.minecraftservercustomizer"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion "27.1.12297006"
    defaultConfig {
        applicationId "com.msc.minecraftservercustomizer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

def minimalProbeAssets = file("$buildDir/generated/minimal-process-assets")
def minimalProbeJar = file("$minimalProbeAssets/minimal-process.jar")
def minimalProbeSources = [
        file('../minimal-process-src/MscProcessProbe.java'),
        file('../minimal-process-src/MscServerLauncher.java')
]
tasks.register('buildMinimalProcessProbe') {
    outputs.file(minimalProbeJar)
    inputs.files(minimalProbeSources)
    doLast {
        def classes = file("$buildDir/generated/minimal-process-classes")
        delete(classes, minimalProbeAssets)
        classes.mkdirs()
        minimalProbeAssets.mkdirs()
        def javaHome = file(System.getProperty('java.home'))
        def javac = new File(javaHome, 'bin/javac.exe').exists()
                ? new File(javaHome, 'bin/javac.exe')
                : new File(javaHome, 'bin/javac')
        def jar = new File(javaHome, 'bin/jar.exe').exists()
                ? new File(javaHome, 'bin/jar.exe')
                : new File(javaHome, 'bin/jar')
        exec { commandLine javac.absolutePath, '--release', '17', '-d', classes.absolutePath, *minimalProbeSources.collect { it.absolutePath } }
        exec { commandLine jar.absolutePath, 'cf', minimalProbeJar.absolutePath, '-C', classes.absolutePath, '.' }
    }
}
android.sourceSets.main.assets.srcDir(minimalProbeAssets)
tasks.named('preBuild').configure { dependsOn('buildMinimalProcessProbe') }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    implementation 'org.tukaani:xz:1.12'
    implementation 'com.bytedance:bytehook:1.0.10'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
