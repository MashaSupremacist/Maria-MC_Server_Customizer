name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Installer + Portable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test (backend)
        run: npm test

      - name: Build
        run: npm run build

      - name: Stage bundled Node for the backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/desktop/resources/bin" | Out-Null
          Copy-Item "$env:ProgramFiles\nodejs\node.exe" "apps/desktop/resources/bin/node.exe" -Force

      - name: Prepare backend deps for packaging
        run: node scripts/prepare-backend-deps.mjs

      - name: Package (electron-builder)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Create portable ZIP
        run: node scripts/make-portable-zip.mjs

      - name: Compute checksums
        shell: bash
        run: |
          cd release
          sha256sum Minecraft\ Server\ Customizer-Setup-*.exe \
            Minecraft\ Server\ Customizer-Portable-*.exe \
            Minecraft\ Server\ Customizer-Portable-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/Minecraft Server Customizer-Setup-*.exe
            release/Minecraft Server Customizer-Portable-*.exe
            release/Minecraft Server Customizer-Portable-*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
